<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#080A0F">
<title>Tu formulario · flowing code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap">
<style>
/* El formulario de onboarding de cada cliente. Una columna, pensada para el
   celular: el cliente responde escribiendo o grabando un audio, y cada
   respuesta se guarda sola. Habla solo con la función `formulario`. */
:root{
  color-scheme:dark;
  --black:#080A0F; --white:#F2F0EB; --lime:#C8FF47; --ink:#080A0F; --agua:#47FFC8; --red:#ff7a6b;
  --mid:#12151D; --mid2:#1A1D26; --border:rgba(242,240,235,.1); --border2:rgba(242,240,235,.2);
  --muted:rgba(242,240,235,.5); --soft:rgba(242,240,235,.76);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--black);color:var(--white);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:6px}
header{padding-block:28px 20px;border-bottom:1px solid var(--border)}
.logo{width:136px}.logo svg{width:100%;height:auto;display:block}
h1{font-size:clamp(28px,7vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:22px 0 0;text-wrap:balance}
.intro{color:var(--soft);font-size:16.5px;margin:12px 0 0;white-space:pre-line}
.how{margin-top:16px;display:grid;gap:8px;font-size:14px;color:var(--soft)}
.how div{display:flex;gap:10px;align-items:flex-start}
.how b{color:var(--lime);font-weight:600;flex:none;width:18px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(8,10,15,.94);backdrop-filter:blur(10px);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--border)}
.bar .wrap{display:flex;align-items:center;gap:12px}
.track{flex:1;height:6px;background:var(--mid2);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--lime);border-radius:99px;transition:width .3s}
.pc{font-size:12.5px;color:var(--soft);flex:none;font-variant-numeric:tabular-nums}
.state{font-size:12px;color:var(--muted);flex:none;min-width:70px;text-align:right}
.state.err{color:var(--red)}
section.blk{padding-top:34px}
section.blk>h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
section.blk>.bd{color:var(--soft);font-size:14.5px;margin:6px 0 0}
.q{margin-top:16px;background:var(--mid);border:1px solid var(--border);border-radius:14px;padding:16px}
.q.ok{border-color:rgba(200,255,71,.35)}
.qt{font-weight:600;font-size:16.5px;line-height:1.4}
.qh{color:var(--muted);font-size:13.5px;margin-top:4px}
.know{margin-top:12px;background:rgba(71,255,200,.06);border:1px solid rgba(71,255,200,.25);border-radius:10px;padding:11px 13px;font-size:14.5px;color:var(--soft)}
.know b{display:block;color:var(--agua);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-bottom:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{appearance:none;border:1px solid var(--border2);background:transparent;color:var(--white);border-radius:999px;padding:9px 14px;font:500 14.5px var(--sans);cursor:pointer;min-height:42px}
.chip[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--ink)}
textarea{display:block;width:100%;margin-top:12px;min-height:96px;resize:vertical;background:var(--black);color:var(--white);
  border:1px solid var(--border2);border-radius:10px;padding:11px 12px;font:400 16px/1.5 var(--sans)}
textarea::placeholder{color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn{appearance:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border2);background:var(--mid2);color:var(--white);
  border-radius:999px;padding:9px 14px;font:500 14px var(--sans);cursor:pointer;min-height:42px}
.btn svg{width:16px;height:16px;flex:none}
.btn.rec{border-color:rgba(255,122,107,.6);color:#fff;background:rgba(255,122,107,.18)}
.btn.rec .dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.btn.rec .dot{animation:none}}
.files{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.files li{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--soft);background:var(--black);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.files li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files li button{appearance:none;background:none;border:0;color:var(--muted);font:500 13px var(--sans);cursor:pointer;padding:4px 6px}
.files li.subiendo{color:var(--lime);border-color:rgba(200,255,71,.35)}
.files li.subiendo span:first-child{flex:none}
.files li.fallo{color:var(--red);border-color:rgba(255,122,107,.45)}
.puntos{display:inline-flex;gap:3px;flex:none}
.puntos i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:puntos 1.2s infinite}
.puntos i:nth-child(2){animation-delay:.2s}.puntos i:nth-child(3){animation-delay:.4s}
@keyframes puntos{0%,80%,100%{opacity:.2}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.puntos i{animation:none;opacity:.7}}
.saved{font-size:12px;color:var(--muted);margin-left:auto}
.send{margin-top:40px;border-top:1px solid var(--border);padding-top:24px}
.send p{color:var(--soft);margin:0 0 14px}
.primary{appearance:none;border:0;background:var(--lime);color:var(--ink);font:700 16px var(--sans);border-radius:999px;padding:14px 22px;cursor:pointer;min-height:50px}
.confirm{margin-top:14px;background:var(--mid);border:1px solid var(--border2);border-radius:12px;padding:14px 16px}
.confirm .row{margin-top:10px}
.msg{margin-top:40px;text-align:center;color:var(--soft)}
.msg h2{color:var(--white);font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px}
.msg.gracias{margin-top:56px}
.msg.gracias h2{font-size:clamp(44px,13vw,64px);line-height:1;color:var(--lime);margin-bottom:14px}
.reunion{margin:26px auto 0;max-width:380px;background:var(--mid);border:1px solid var(--border2);border-radius:12px;padding:16px 18px}
.reunion small{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.reunion b{display:block;color:var(--white);font-size:19px;font-weight:700;line-height:1.35}
footer{margin-top:48px;color:var(--muted);font-size:12.5px}
header.chico .intro,header.chico .how{display:none}
header.chico h1{font-size:19px;margin-top:10px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--lime);margin-bottom:8px}
.pasos .q{margin-top:28px;padding:20px 18px}
.pasos .qt{font-size:19px;line-height:1.35}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:18px}
.nav .primary{flex:1;max-width:260px;margin-left:auto}
.nav .atras{appearance:none;background:none;border:1px solid var(--border2);color:var(--soft);border-radius:999px;padding:12px 18px;font:500 15px var(--sans);cursor:pointer;min-height:50px}
.empezar{margin-top:22px}
.send .row{margin-top:0}
.send .chip.accesos{border-color:var(--lime);color:var(--lime)}
.ins{margin:40px auto 0;text-align:left;max-width:560px}
.ins h3{font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--white);margin:0 0 6px}
.ins>p{color:var(--soft);font-size:14.5px;margin:0 0 14px}
.cta-c{background:var(--mid);border:1px solid var(--border2);border-radius:12px;padding:12px 14px;margin-top:10px}
.cta-c b{display:block;color:var(--white);font-size:14px;margin-bottom:6px}
.cta-c .lin{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--soft);margin-top:4px;flex-wrap:wrap}
.cta-c .lin code{font-family:ui-monospace,Menlo,monospace;color:var(--white);word-break:break-all}
.cta-c .lin button{appearance:none;border:1px solid var(--border2);background:none;color:var(--lime);border-radius:999px;padding:4px 10px;font:500 12.5px var(--sans);cursor:pointer;margin-left:auto}
.vid{margin-top:18px}
.vid b{display:block;color:var(--white);font-size:15px;margin-bottom:8px}
.vid video{width:100%;border-radius:12px;background:#000;display:block}
.vid a{display:inline-block;margin-top:6px;color:var(--lime);font-size:13px}
[hidden]{display:none!important}
</style>
</head>

  <div class="track" aria-hidden="true"><i id="prog"></i></div>
  <span class="pc" id="pc"></span>
  <span class="state" id="state" aria-live="polite"></span>
</div></div>
<main class="wrap" id="main">
  <p class="msg" id="loading">Cargando tu formulario…</p>
</main>

<script>
(function(){
  'use strict';
  var FN='https://onnysveksgxtmspxgbow.supabase.co/functions/v1/formulario';
  // El código viaja en el # del link: el navegador no lo manda a ningún servidor.
  var T=(location.hash||'').replace(/^#/,'').trim();
  var main=document.getElementById('main');
  var F=null, R={}, timers={}, pend=0;

  function el(tag, attrs, kids){
    var e=document.createElement(tag);
    Object.keys(attrs||{}).forEach(function(k){
      if(k==='text') e.textContent=attrs[k];
      else if(k.indexOf('on')===0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (kids||[]).forEach(function(c){ if(c) e.appendChild(c); });
    return e;
  }
  function api(body){
    body.t=T;
    return fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){ return r.json().then(function(d){ if(!r.ok||d.error) throw new Error(d.error||('Error '+r.status)); return d; }); });
  }
  function estado(txt, err){ var s=document.getElementById('state'); s.textContent=txt||''; s.classList.toggle('err', !!err); }
  function trabajo(delta){ pend+=delta; if(pend>0) estado('Guardando…'); }
  function fallo(e){ estado('No se guardó', true); console.warn(e); }

  function respondida(p){
    var x=R[p.id]||{};
    return !!((x.texto&&String(x.texto).trim()) || x.opcion || (x.audios&&x.audios.length) || (x.archivos&&x.archivos.length));
  }
  function progreso(){
    var vs=visibles(), hechas=vs.filter(function(q){ return respondida(q.p); }).length;
    document.getElementById('prog').style.width=(vs.length?Math.round(100*hechas/vs.length):0)+'%';
    document.getElementById('pc').textContent=hechas+' de '+vs.length;
    pintarNav();
    (F.bloques||[]).forEach(function(b){ (b.preguntas||[]).forEach(function(p){
      var c=document.getElementById('q-'+p.id); if(c) c.classList.toggle('ok', respondida(p)); }); });
  }

  var cola={};
  function guardar(pid, campos){
    R[pid]=Object.assign({}, R[pid]||{}, campos);
    // Se juntan los cambios de la misma pregunta: tocar una opción y escribir
    // enseguida no tiene que perder la opción.
    cola[pid]=Object.assign({}, cola[pid]||{}, campos);
    progreso();
    clearTimeout(timers[pid]);
    timers[pid]=setTimeout(function(){
      var envio=cola[pid]; delete cola[pid];
      trabajo(1);
      api(Object.assign({accion:'guardar', pregunta_id:pid}, envio))
        .then(function(){ trabajo(-1); if(pend<=0) estado('Guardado'); })
        .catch(function(e){ trabajo(-1); fallo(e); });
    }, 900);
  }

  function lista(p, ul){
    // Los que se están subiendo todavía quedan: si suben dos a la vez, el primero no borra el aviso del otro.
    var quedan=Array.prototype.slice.call(ul.querySelectorAll('li.subiendo, li.fallo'));
    ul.innerHTML='';
    var x=R[p.id]||{};
    (x.audios||[]).forEach(function(a, i){
      ul.appendChild(el('li',{},[el('span',{text:'Audio '+(i+1)+(a.seg?(' · '+Math.floor(a.seg/60)+':'+('0'+Math.round(a.seg%60)).slice(-2)):'')}),
        el('button',{type:'button',text:'Quitar',onclick:function(){ quitar(p, a.path, ul); }})]));
    });
    (x.archivos||[]).forEach(function(a){
      ul.appendChild(el('li',{},[el('span',{text:a.nombre||'Archivo'}),
        el('button',{type:'button',text:'Quitar',onclick:function(){ quitar(p, a.path, ul); }})]));
    });
    quedan.forEach(function(li){ ul.appendChild(li); });
  }
  function quitar(p, path, ul){
    trabajo(1);
    api({accion:'quitar', pregunta_id:p.id, path:path}).then(function(d){
      trabajo(-1); R[p.id]=Object.assign({}, R[p.id], {audios:d.audios, archivos:d.archivos}); lista(p, ul); progreso(); estado('Guardado');
    }).catch(function(e){ trabajo(-1); fallo(e); });
  }
  function subir(p, blob, tipo, nombre, seg, ul){
    trabajo(1); estado('Subiendo…');
    // Sin esto, al terminar de grabar no pasa nada a la vista y parece que falló (Angie, 23/10/2026).
    var prov=el('li',{class:'subiendo'},[el('span',{text:tipo==='audio'?'Guardando tu audio':'Subiendo '+nombre}),
      el('span',{class:'puntos','aria-hidden':'true'},[el('i'),el('i'),el('i')])]);
    prov.setAttribute('role','status'); ul.appendChild(prov);
    var mime=blob.type||'application/octet-stream';
    return api({accion:'subir', pregunta_id:p.id, tipo:tipo, nombre:nombre, mime:mime, tam:blob.size})
      .then(function(d){
        return fetch(d.url,{method:'PUT',headers:{'Content-Type':mime},body:blob}).then(function(r){
          if(!r.ok) throw new Error('No se pudo subir ('+r.status+')');
          return api({accion:'confirmar', pregunta_id:p.id, tipo:tipo, path:d.path, nombre:nombre, tam:blob.size, seg:seg});
        });
      })
      .then(function(d){ trabajo(-1); prov.remove(); R[p.id]=Object.assign({}, R[p.id], {audios:d.audios, archivos:d.archivos}); lista(p, ul); progreso(); estado('Guardado'); })
      .catch(function(e){ trabajo(-1); fallo(e); alert2(e.message);
        prov.className='fallo'; prov.innerHTML='';
        prov.appendChild(el('span',{text:(tipo==='audio'?'El audio':'El archivo')+' no se guardó. Probá de nuevo o escribilo.'}));
        prov.appendChild(el('button',{type:'button',text:'Cerrar',onclick:function(){ prov.remove(); }})); });
  }
  function alert2(t){ estado(t, true); }
  // Los mismos instructivos de Meta del artifact «Instructivos del CRM» (pestaña Meta).
  function instructivosHtml(ins){
    var box=el('div',{class:'ins'},[el('h3',{text:'Adelantá los accesos de Meta'})]);
    if(!ins){ box.appendChild(el('p',{text:'No pudimos cargar los videos. Te los mandamos por WhatsApp.'})); return box; }
    box.appendChild(el('p',{text:ins.intro||''}));
    (ins.cuentas||[]).forEach(function(c){
      var linea=function(etq, val){
        var b=el('button',{type:'button',text:'Copiar'});
        b.addEventListener('click', function(){
          var hecho=function(){ b.textContent='Copiado'; setTimeout(function(){ b.textContent='Copiar'; }, 1500); };
          if(navigator.clipboard) navigator.clipboard.writeText(val).then(hecho, function(){ b.textContent='Mantené apretado para copiar'; });
        });
        return el('div',{class:'lin'},[el('span',{text:etq}), el('code',{text:val}), b]);
      };
      box.appendChild(el('div',{class:'cta-c'},[el('b',{text:c.nombre||''}), linea('Como persona · mail', c.mail||''), linea('Como socio · ID de negocio', c.negocio||'')]));
    });
    (ins.videos||[]).forEach(function(v){
      if(!v.url) return;
      var vid=el('video',{controls:'',preload:'metadata',playsinline:'',src:v.url,'aria-label':v.titulo||''});
      if(v.poster) vid.setAttribute('poster', v.poster);
      box.appendChild(el('div',{class:'vid'},[el('b',{text:v.titulo||''}), vid, el('a',{href:v.url,target:'_blank',rel:'noopener',text:'Abrir video'})]));
    });
    box.appendChild(el('p',{text:'Si te trabás en algún paso, anotá el minuto del video y escribinos por el grupo de WhatsApp.'}));
    return box;
  }
  // La hora va en la zona del que lo abre: el cliente puede no estar en Argentina.
  function reunionHtml(iso){
    var t=iso?new Date(iso):null;
    if(!t||isNaN(t)) return null;
    var dia=t.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
    var hora=t.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',hour12:false});
    return el('div',{class:'reunion'},[el('small',{text:'Tu próxima reunión'}),
      el('b',{text:dia.charAt(0).toUpperCase()+dia.slice(1)+' a las '+hora}),
      el('span',{text:'Ahí revisamos juntos lo que nos mandaste.'})]);
  }

  var ICO_MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3.5"/></svg>';
  var ICO_CLIP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.5 8.5a5 5 0 01-7-7l9-9a3.5 3.5 0 015 5l-9 9a2 2 0 01-3-3l8-8"/></svg>';

  function grabador(p, ul){
    var b=el('button',{type:'button',class:'btn'}); b.innerHTML=ICO_MIC+'<span>Grabar audio</span>';
    if(!(navigator.mediaDevices && window.MediaRecorder)){ b.disabled=true; b.title='Este navegador no deja grabar: escribilo o subí un audio como archivo.'; return b; }
    var rec=null, partes=[], t0=0, tick=null;
    b.addEventListener('click', function(){
      if(rec){ rec.stop(); return; }
      navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
        var tipos=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg'];
        var mt=tipos.filter(function(x){ return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(x); })[0];
        rec=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream);
        partes=[]; t0=Date.now();
        rec.ondataavailable=function(e){ if(e.data&&e.data.size) partes.push(e.data); };
        rec.onstop=function(){
          stream.getTracks().forEach(function(x){ x.stop(); });
          clearInterval(tick); var seg=(Date.now()-t0)/1000;
          var blob=new Blob(partes,{type:(rec.mimeType||'audio/webm').split(';')[0]});
          rec=null; b.classList.remove('rec'); b.innerHTML=ICO_MIC+'<span>Grabar audio</span>';
          if(blob.size>0) subir(p, blob, 'audio', 'audio', Math.round(seg), ul);
        };
        rec.start();
        b.classList.add('rec');
        var pinta=function(){ var s=Math.round((Date.now()-t0)/1000); b.innerHTML='<span class="dot"></span><span>Grabando '+Math.floor(s/60)+':'+('0'+(s%60)).slice(-2)+' · tocá para terminar</span>'; };
        pinta(); tick=setInterval(pinta, 500);
      }).catch(function(){ alert2('No pudimos usar el micrófono. Revisá el permiso del navegador, o escribilo.'); });
    });
    return b;
  }
  function adjuntar(p, ul){
    var inp=el('input',{type:'file',id:'f-'+p.id,multiple:'multiple'}); inp.hidden=true;
    inp.addEventListener('change', function(){
      Array.prototype.forEach.call(inp.files||[], function(f){ subir(p, f, 'archivo', f.name, null, ul); });
      inp.value='';
    });
    var b=el('button',{type:'button',class:'btn',onclick:function(){ inp.click(); }}); b.innerHTML=ICO_CLIP+'<span>Subir archivo</span>';
    var w=document.createElement('span'); w.appendChild(inp); w.appendChild(b); return w;
  }

  function pregunta(p){
    var x=R[p.id]||{};
    var card=el('div',{class:'q',id:'q-'+p.id});
    card.appendChild(el('div',{class:'qt',text:p.texto||''}));
    if(p.ayuda) card.appendChild(el('div',{class:'qh',text:p.ayuda}));
    if(p.sabemos) card.appendChild(el('div',{class:'know'},[el('b',{text:'Lo que entendimos'}), document.createTextNode(p.sabemos)]));
    var ta=null;
    var opciones=(p.tipo==='confirmar') ? ['Sí, es así','Hay algo distinto'] : (p.opciones||null);
    if(opciones){
      var row=el('div',{class:'row',role:'group','aria-label':p.texto||''});
      opciones.forEach(function(o){
        var c=el('button',{type:'button',class:'chip','aria-pressed':String(x.opcion===o),text:o});
        c.addEventListener('click', function(){
          var nuevo=(R[p.id]||{}).opcion===o?null:o;
          Array.prototype.forEach.call(row.children, function(k){ k.setAttribute('aria-pressed', String(k.textContent===nuevo)); });
          guardar(p.id, {opcion:nuevo});
          if(ta && p.tipo==='confirmar') ta.hidden=(nuevo!=='Hay algo distinto' && !(R[p.id]||{}).texto);
        });
        row.appendChild(c);
      });
      card.appendChild(row);
    }
    ta=el('textarea',{id:'t-'+p.id,'aria-label':p.texto||'Tu respuesta',placeholder:p.placeholder||(p.tipo==='confirmar'?'Contanos qué es distinto':'Escribí acá, o grabá un audio')});
    ta.value=x.texto||'';
    if(p.tipo==='confirmar' && x.opcion!=='Hay algo distinto' && !x.texto) ta.hidden=true;
    ta.addEventListener('input', function(){ guardar(p.id, {texto:ta.value}); });
    card.appendChild(ta);
    var ul=el('ul',{class:'files'});
    var tools=el('div',{class:'tools'},[grabador(p, ul), (p.archivo?adjuntar(p, ul):null)]);
    card.appendChild(tools); card.appendChild(ul); lista(p, ul);
    return card;
  }

  // Una pregunta por pantalla (Angie, 23/10/2026): de a una se contesta más en el celu.
  // Las tarjetas se arman todas una vez (así no se pierden audios ni lo escrito al ir y
  // volver) y solo se muestra la del paso actual. Paso -1 es la portada; el último, enviar.
  var todas=[], paso=-1, nav=null, envio=null;
  // Una pregunta con «si» aparece solo si la otra tiene esa opción elegida
  // (ej.: «¿Quiénes son?» solo si contestaron que conocen a su competencia).
  function visible(q){ return !q.p.si || (q.p.si.opciones||[]).indexOf((R[q.p.si.id]||{}).opcion)>=0; }
  function visibles(){ return todas.filter(visible); }
  function irA(i){
    var vs=visibles();
    paso=Math.max(-1, Math.min(i, vs.length));
    var head=document.querySelector('header');
    head.classList.toggle('chico', paso>=0);
    todas.forEach(function(q){ q.card.hidden=true; });
    var actual=(paso>=0 && paso<vs.length)?vs[paso]:null;
    if(actual) actual.card.hidden=false;
    envio.hidden=(paso!==vs.length);
    document.getElementById('empezar').hidden=(paso!==-1);
    nav.hidden=(paso===-1);
    pintarNav();
    window.scrollTo(0,0);
    if(actual){ var t=actual.card.querySelector('.qt'); if(t){ t.setAttribute('tabindex','-1'); t.focus({preventScroll:true}); } }
  }
  function pintarNav(){
    if(!nav) return;
    var vs=visibles(), actual=(paso>=0 && paso<vs.length)?vs[paso]:null;
    nav.innerHTML='';
    nav.appendChild(el('button',{type:'button',class:'atras',text:'← Anterior',onclick:function(){ irA(paso-1); }}));
    if(actual) nav.appendChild(el('button',{type:'button',class:'primary',
      text:respondida(actual.p)?'Siguiente →':'Saltar esta →',onclick:function(){ irA(paso+1); }}));
  }

  function pintar(){
    document.getElementById('titulo').textContent=F.titulo||'Tu formulario';
    document.getElementById('intro').textContent=F.intro||'';
    document.getElementById('how').hidden=false;
    document.getElementById('bar').hidden=false;
    document.title=(F.titulo||'Tu formulario')+' · flowing code';
    main.innerHTML='';
    var yaEnviado=F.estado==='completo';
    var arranque=el('div',{class:'empezar',id:'empezar'});
    main.appendChild(arranque);
    var cont=el('div',{class:'pasos'});
    todas=[];
    (F.bloques||[]).forEach(function(b){
      (b.preguntas||[]).forEach(function(p){
        var card=pregunta(p);
        card.insertBefore(el('div',{class:'eyebrow',text:b.titulo||''}), card.firstChild);
        card.hidden=true; cont.appendChild(card);
        todas.push({p:p, card:card});
      });
    });
    main.appendChild(cont);
    nav=el('div',{class:'nav'});
    var hechas=todas.filter(function(q){ return visible(q) && respondida(q.p); }).length;
    arranque.appendChild(el('button',{type:'button',class:'primary',
      text:yaEnviado?'Revisar mis respuestas':(hechas?'Seguir donde quedé':'Empezar'),
      onclick:function(){
        var vs=visibles(), i=0;
        if(!yaEnviado){ for(i=0;i<vs.length && respondida(vs[i].p);i++){} }
        irA(i);
      }}));
    envio=el('div',{class:'send'});
    envio.appendChild(el('p',{text:yaEnviado
      ? 'Ya nos llegó tu formulario. Si querés sumar o corregir algo, hacelo y volvé a tocar Enviar.'
      : 'Llegaste al final. Si alguna pregunta no aplicaba o no la sabías, no pasa nada: lo charlamos en la próxima reunión.'}));
    var btn=el('button',{type:'button',class:'primary',text:yaEnviado?'Enviar de nuevo':'Enviar'});
    var conf=el('div',{class:'confirm'}); conf.hidden=true;
    var conAccesos=false;
    btn.addEventListener('click', function(){ conAccesos=false; conf.hidden=false; btn.hidden=true; if(btnAcc) btnAcc.hidden=true; });
    conf.appendChild(el('div',{text:'¿Lo enviamos? Lo que no respondiste lo podemos charlar en la próxima reunión.'}));
    conf.appendChild(el('div',{class:'row'},[
      el('button',{type:'button',class:'primary',text:'Sí, enviar',onclick:function(){
        trabajo(1);
        api({accion:'enviar', accesos:conAccesos}).then(function(d){
          trabajo(-1); estado('Enviado');
          main.innerHTML=''; nav=null;
          document.querySelector('header').classList.add('chico');
          main.appendChild(el('div',{class:'msg gracias'},[el('h2',{text:'¡Gracias!'}),
            el('p',{text:'Ya tenemos tus respuestas. Con esto armamos tu estrategia. Si te acordás de algo más, volvé a abrir este link y sumalo.'}),
            reunionHtml(d&&d.proxima)]));
          if(conAccesos) main.appendChild(instructivosHtml(d&&d.instructivos));
          window.scrollTo(0,0);
        }).catch(function(e){ trabajo(-1); fallo(e); });
      }}),
      el('button',{type:'button',class:'chip',text:'Todavía no',onclick:function(){ conf.hidden=true; btn.hidden=false; if(btnAcc) btnAcc.hidden=false; }})
    ]));
    var btnAcc=null;
    if(F.accesos){
      // Solo a los que ya pautaron (accesos = true en su formulario, Angie 23/10/2026).
      btnAcc=el('button',{type:'button',class:'chip accesos',text:'Enviar y adelantar accesos'});
      btnAcc.addEventListener('click', function(){ conAccesos=true; conf.hidden=false; btn.hidden=true; btnAcc.hidden=true; });
    }
    envio.appendChild(el('div',{class:'row'},[btn, btnAcc])); envio.appendChild(conf);
    main.appendChild(envio);
    main.appendChild(nav);
    main.appendChild(el('footer',{text:'flowing code · tus respuestas solo las ve el equipo que trabaja con vos.'}));
    progreso();
    irA(-1);
  }

  // El código largo de 40 o el corto «cliente-8 al azar» (23/10/2026); la función valida igual.
  if(!/^[A-Za-z0-9]{40}$/.test(T) && !(/^[a-z0-9]+(-[a-z0-9]+)*-[A-Za-z0-9]{8}$/.test(T) && T.length<=60)){
    main.innerHTML='<div class="msg"><h2>Este link no está completo</h2><p>Abrilo desde el mensaje que te mandamos, sin cortarlo. Si sigue sin andar, escribile a tu CSM.</p></div>';
    return;
  }
  api({accion:'leer'}).then(function(d){ F=d; R=d.respuestas||{}; pintar(); })
    .catch(function(e){ main.innerHTML=''; main.appendChild(el('div',{class:'msg'},[el('h2',{text:'No pudimos abrir tu formulario'}), el('p',{text:e.message})])); });
  window.addEventListener('beforeunload', function(e){ if(pend>0){ e.preventDefault(); e.returnValue=''; } });
})();
</script>
</body>
</html>
