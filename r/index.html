<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Resumen de la semana · flowing code</title>
<style>
  :root{--bg:#080A0F;--fg:#F2F0EB;--mut:rgba(242,240,235,.55);color-scheme:dark}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,sans-serif}
  #marco{display:block;width:100%;height:100%;border:0;background:var(--bg)}
  .msg{min-height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;font-size:15px;line-height:1.6;color:var(--mut)}
  .msg b{display:block;color:var(--fg);font-size:18px;margin-bottom:6px}
</style>
</head>
<body>
<div class="msg" id="msg"><div>Cargando el resumen…</div></div>
<script>
/* Reporte semanal con link propio (Angie, 23/11/2026). El token va en el #, que
   no viaja al servidor. El HTML se muestra en un marco aislado (sandbox sin
   allow-same-origin): no puede leer nada del tracker. */
(function(){
  var SB_URL='https://onnysveksgxtmspxgbow.supabase.co';
  var SB_KEY='sb_publishable_2gpOBfyUspnqRSKH0egoZA_4A6TqMKv';
  var msg=document.getElementById('msg');
  function error(t,s){ msg.innerHTML='<div><b>'+t+'</b>'+s+'</div>'; }
  var tok=(location.hash||'').replace(/^#/,'').trim();
  if(!/^[0-9a-f]{32}$/.test(tok)){ error('Este link no está completo','Pedile al equipo de flowing code que te lo vuelva a pasar.'); return; }
  fetch(SB_URL+'/rest/v1/rpc/reporte_publico',{method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:tok})})
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(rows){
    if(!rows||!rows.length||!rows[0].html){ error('No encontramos este resumen','Puede que el link esté mal copiado. Pedile al equipo que te lo vuelva a pasar.'); return; }
    var f=document.createElement('iframe');
    f.id='marco'; f.title='Resumen de la semana';
    f.setAttribute('sandbox','allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation');
    f.srcdoc=rows[0].html;
    msg.replaceWith(f);
  })
  .catch(function(){ error('No se pudo cargar el resumen','Revisá la conexión y volvé a abrir el link.'); });
})();
</script>
</body>
</html>
